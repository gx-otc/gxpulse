<html lang="en">

            align-items: center;
            justify-content: center;

        .logo-text h1 {

            border: none;
            font-size: 1.6rem;
            color: white;
            cursor: pointer;

        .card {
            background: #14171f;
            border-radius: 20px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            border: 1px solid #252a36;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .kpi-card {
            background: #1a1e28;
            border-radius: 20px;
            padding: 1rem;
            text-align: center;
        }

        .kpi-number {
            font-size: 2rem;
            font-weight: 700;
            color: #4caf7f;
        }

        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .chart-container {
            background: #14171f;
            border-radius: 20px;
            padding: 1rem;
        }

        canvas {
            max-height: 280px;
            width: 100%;
        }

        /* tables */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            overflow-x: auto;
            display: block;
        }

        .data-table th, .data-table td {
            text-align: left;
            padding: 0.8rem 0.5rem;
            border-bottom: 1px solid #2a2e3a;
        }

        /* forms */
        input, select, button {
            background: #1e212a;
            border: 1px solid #323842;
            padding: 8px 14px;
            border-radius: 12px;
            color: white;
        }

        button {
            background: #2b5f3b;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
            align-items: center;

            border-radius: 40px;
            font-size: 0.7rem;
        }

        }

        .alert {
            background: #1e2128;
            padding: 0.8rem;
            border-radius: 12px;
            margin: 0.5rem 0;
        }

</head>

    async function hashPassword(pwd){
        const encoder = new TextEncoder();
        const data = encoder.encode(pwd);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2,'0')).join('');
    }

    async function verifyLogin(userId, password){
        let user = localData.users.find(u=>u.user_id.toLowerCase()===userId.toLowerCase());
        if(!user) return null;
        let hashed = await hashPassword(password);
        if(user.password_hash === hashed && user.active) return user;
        return null;
    }

    function getEntriesFiltered(marketId=null, commodityId=null, startDate=null, endDate=null){
        let entries = [...localData.entries];
        if(marketId) entries = entries.filter(e=>e.market_id===marketId);
        if(commodityId) entries = entries.filter(e=>e.commodity_id===commodityId);
        if(startDate) entries = entries.filter(e=>new Date(e.date) >= new Date(startDate));
        if(endDate) entries = entries.filter(e=>new Date(e.date) <= new Date(endDate));
        return entries;

        document.getElementById("latestTableBody").innerHTML = latest.map(e=>`<tr><td>${e.date}</td><td>${e.market_name}</td><td>${e.commodity_name}</td><td>₦${e.price.toLocaleString()}</td></tr>`).join("");
        if(["admin","staff"].includes(currentUser.role)){
            let formHtml = `<div class="card"><h3>Quick Price Entry</h3><div class="filter-bar"><select id="quickMarket"><option value="">Market</option>${localData.markets.map(m=>`<option value="${m.market_id}">${m.market_name}</option>`).join("")}</select>
            <select id="quickCommodity"><option value="">Commodity</option>${localData.commodities.map(c=>`<option value="${c.commodity_id}">${c.commodity_name}</option>`).join("")}</select>
            <input type="number" id="quickPrice" placeholder="Price (₦)">
            <button id="quickSubmit">Submit</button></div></div>`;
            container.insertAdjacentHTML("beforeend", formHtml);
            document.getElementById("quickSubmit").onclick = async()=>{
                let marketId = document.getElementById("quickMarket").value;
                let commodityId = document.getElementById("quickCommodity").value;
                let price = parseFloat(document.getElementById("quickPrice").value);
                if(!marketId || !commodityId || isNaN(price)){ alert("Fill all fields"); return; }
                let newEntry = {
                    entry_id: "e_"+Date.now(),
                    date: new Date().toISOString().split('T')[0],
                    timestamp_ms: Date.now(),
                    market_id: marketId,
                    market_name: localData.markets.find(m=>m.market_id===marketId)?.market_name,
                    commodity_id: commodityId,
                    commodity_name: localData.commodities.find(c=>c.commodity_id===commodityId)?.commodity_name,
                    price: price,
                    user_id: currentUser.user_id,
                    source: "web",
                    created_at: new Date().toISOString()
                };
                localData.entries.push(newEntry);
                localStorage.setItem("gx_entries", JSON.stringify(localData.entries));
                renderCurrentPage();
            };
        }
    }

    async function renderReports(container){
        let markets = localData.markets;
        let commodities = localData.commodities;
        container.innerHTML = `<div class="card"><h3>Filter Reports</h3><div class="filter-bar" id="reportFilters"></div><div style="overflow-x:auto;"><table class="data-table" id="reportTable"></table></div></div>`;
        let filterDiv = document.getElementById("reportFilters");
        filterDiv.innerHTML = `
            <select id="repMarket"><option value="">All Markets</option>${markets.map(m=>`<option value="${m.market_id}">${m.market_name}</option>`).join("")}</select>
            <select id="repCommodity"><option value="">All Commodities</option>${commodities.map(c=>`<option value="${c.commodity_id}">${c.commodity_name}</option>`).join("")}</select>
            <input type="date" id="repStart"><input type="date" id="repEnd"><button id="applyReport">Apply</button>
        `;
        function refreshReport(){
            let marketId = document.getElementById("repMarket").value;
            let commodityId = document.getElementById("repCommodity").value;
            let start = document.getElementById("repStart").value;
            let end = document.getElementById("repEnd").value;
            let filtered = getEntriesFiltered(marketId||null, commodityId||null, start||null, end||null);
            let tbody = `<thead><tr><th>Date</th><th>Market</th><th>Commodity</th><th>Price</th><th>User</th></tr></thead><tbody>${filtered.slice(0,100).map(e=>`<tr><td>${e.date}</td><td>${e.market_name}</td><td>${e.commodity_name}</td><td>₦${e.price.toLocaleString()}</td><td>${e.user_id}</td></tr>`).join("")}</tbody>`;
            document.getElementById("reportTable").innerHTML = tbody;
        }
        document.getElementById("applyReport").onclick = refreshReport;
        refreshReport();
    }

    async function renderTrendCharts(container){
        container.innerHTML = `<div class="card"><h3>Latest Price Across Markets</h3><canvas id="latestBarChart"></canvas></div>`;
        let latestByCommodity = {};
        localData.commodities.forEach(c=>{ latestByCommodity[c.commodity_id] = {commodity:c, prices:[]}; });
        localData.entries.forEach(e=>{
            let entry = latestByCommodity[e.commodity_id];
            if(entry) entry.prices.push({market:e.market_name, price:e.price, date:e.date});
        });
        let selectedComm = localData.commodities[0]?.commodity_id;
        let ctx = document.getElementById("latestBarChart").getContext("2d");
        function renderBar(commId){
            let commPrices = latestByCommodity[commId]?.prices || [];
            let marketMap = new Map();
            commPrices.forEach(p=>{ if(!marketMap.has(p.market) || new Date(p.date)>new Date(marketMap.get(p.market).date)) marketMap.set(p.market, p); });
            let labels = Array.from(marketMap.keys());
            let data = labels.map(l=>marketMap.get(l).price);
            if(chartInstances.bar) chartInstances.bar.destroy();
            chartInstances.bar = new Chart(ctx, { type:'bar', data:{ labels, datasets:[{ label:'Latest Price (₦)', data, backgroundColor:'#2b5f3b' }] } });
        }
        let selector = `<select id="trendCommodity">${localData.commodities.map(c=>`<option value="${c.commodity_id}">${c.commodity_name}</option>`).join("")}</select>`;
        container.insertAdjacentHTML("afterbegin", `<div class="filter-bar">${selector}</div>`);
        document.getElementById("trendCommodity").onchange = (e)=> renderBar(e.target.value);
        renderBar(selectedComm);
    }

    async function renderMarketCompare(container){
        container.innerHTML = `<div class="card"><h3>Market Comparison</h3><div class="filter-bar"><select id="compCommodity"></select><button id="compareBtn">Compare</button></div><canvas id="compareChart"></canvas><div id="compareTable"></div></div>`;
        let commoditySelect = document.getElementById("compCommodity");
        commoditySelect.innerHTML = localData.commodities.map(c=>`<option value="${c.commodity_id}">${c.commodity_name}</option>`).join("");
        async function doCompare(){
            let commodityId = commoditySelect.value;
            let entries = localData.entries.filter(e=>e.commodity_id===commodityId);
            let marketMap = new Map();
            entries.forEach(e=>{ if(!marketMap.has(e.market_id) || new Date(e.date) > new Date(marketMap.get(e.market_id).date)) marketMap.set(e.market_id, e); });
            let labels = Array.from(marketMap.values()).map(e=>e.market_name);
            let prices = Array.from(marketMap.values()).map(e=>e.price);
            if(chartInstances.comp) chartInstances.comp.destroy();
            let ctx = document.getElementById("compareChart").getContext("2d");
            chartInstances.comp = new Chart(ctx, { type:'bar', data:{ labels, datasets:[{ label:'Latest Price', data:prices, backgroundColor:'#4caf7f' }] } });
            document.getElementById("compareTable").innerHTML = `<table class="data-table"><thead><tr><th>Market</th><th>Price (₦)</th><th>Date</th></tr></thead><tbody>${Array.from(marketMap.values()).map(e=>`<tr><td>${e.market_name}</td><td>₦${e.price.toLocaleString()}</td><td>${e.date}</td></tr>`).join("")}</tbody></table>`;
        }
        document.getElementById("compareBtn").onclick = doCompare;
        doCompare();
    }

    async function renderArbitrage(container){
        container.innerHTML = `<div class="card"><h3>Arbitrage Opportunities</h3><div class="filter-bar"><select id="arbCommodity"></select><button id="calcArb">Analyze</button></div><div id="arbTable"></div></div>`;
        let arbComm = document.getElementById("arbCommodity");
        arbComm.innerHTML = localData.commodities.map(c=>`<option value="${c.commodity_id}">${c.commodity_name}</option>`).join("");
        document.getElementById("calcArb").onclick = ()=>{
            let commId = arbComm.value;
            let entries = localData.entries.filter(e=>e.commodity_id===commId);
            let latestMap = new Map();
            entries.forEach(e=>{ if(!latestMap.has(e.market_id) || new Date(e.date) > new Date(latestMap.get(e.market_id).date)) latestMap.set(e.market_id, e); });
            let prices = Array.from(latestMap.values()).sort((a,b)=>a.price-b.price);
            if(prices.length<2){ document.getElementById("arbTable").innerHTML = "<div>Insufficient data</div>"; return; }
            let minMarket = prices[0], maxMarket = prices[prices.length-1];
            let spread = maxMarket.price - minMarket.price;
            document.getElementById("arbTable").innerHTML = `<div class="alert"><strong>Buy:</strong> ${minMarket.market_name} @ ₦${minMarket.price.toLocaleString()} &nbsp;|&nbsp; <strong>Sell:</strong> ${maxMarket.market_name} @ ₦${maxMarket.price.toLocaleString()}<br>Potential Spread: ₦${spread.toLocaleString()}</div><table class="data-table"><thead><tr><th>Market</th><th>Price</th><th>Date</th></tr></thead><tbody>${prices.map(p=>`<tr><td>${p.market_name}</td><td>₦${p.price.toLocaleString()}</td><td>${p.date}</td></tr>`).join("")}</tbody></table>`;
        };
        document.getElementById("calcArb").click();
    }

    async function renderAdmin(container){
        container.innerHTML = `<div class="card"><h3>Admin Panel</h3><div><button id="syncCloudBtn">Sync to Cloud (Simulate)</button><button id="resetLocalBtn" class="danger">Reset Local Data</button></div><div id="syncStatus"></div><hr><h4>Manage Users</h4><div id="userList"></div><div><input id="newUserId" placeholder="user_id"><input id="newFullName" placeholder="Full Name"><select id="newRole"><option>staff</option><option>merchant</option><option>analyst</option></select><button id="createUserBtn">Create User</button></div></div>`;
        document.getElementById("syncCloudBtn").onclick = ()=>{ document.getElementById("syncStatus").innerHTML = "<div class='alert'>Cloud sync placeholder: would push to Supabase</div>"; };
        document.getElementById("resetLocalBtn").onclick = ()=>{ localStorage.clear(); seedLocalStorageIfEmpty(); loadDataFromLocal(); renderCurrentPage(); };
        function renderUserList(){
            let html = `<table class="data-table"><thead><tr><th>User</th><th>Role</th><th>Active</th><th>Force Reset Pwd</th></tr></thead><tbody>${localData.users.map(u=>`<tr><td>${u.full_name}</td><td>${u.role}</td><td>${u.active? "✅":"❌"}</td><td><button class="smallReset" data-id="${u.user_id}">Reset Pwd</button></td></tr>`).join("")}</tbody></table>`;
            document.getElementById("userList").innerHTML = html;
            document.querySelectorAll(".smallReset").forEach(btn=>{
                btn.onclick = async (e)=>{
                    let uid = btn.dataset.id;
                    let newPwd = prompt("New password for "+uid);
                    if(newPwd){
                        let hash = await hashPassword(newPwd);
                        let user = localData.users.find(u=>u.user_id===uid);
                        if(user) { user.password_hash = hash; saveUserToLocal(user); renderUserList(); alert("Password reset"); }
                    }
                };
            });
        }
        document.getElementById("createUserBtn").onclick = async ()=>{
            let uid = document.getElementById("newUserId").value.trim();
            let name = document.getElementById("newFullName").value.trim();
            let role = document.getElementById("newRole").value;
            if(!uid || !name){ alert("Fill fields"); return; }
            let defaultPwd = "changeme";
            let hash = await hashPassword(defaultPwd);
            let newUser = { user_id:uid, full_name:name, role, active:true, password_hash:hash, created_at:new Date().toISOString() };
            localData.users.push(newUser);
            localStorage.setItem("gx_users", JSON.stringify(localData.users));
            renderUserList();
            alert(`User ${uid} created with default password "changeme". Force change on login.`);
        };
        renderUserList();
    }

    function showLogin(){
        document.getElementById("pageContent").innerHTML = `
            <div class="card" style="max-width:400px; margin:2rem auto;">
                <h2>GXPULSE Login</h2>
                <input type="text" id="loginUser" placeholder="User ID" autocomplete="off"><br><br>
                <input type="password" id="loginPass" placeholder="Password"><br><br>
                <button id="loginBtn">Login</button>
                <div id="loginError" style="color:#ff8a6a; margin-top:1rem;"></div>
            </div>
        `;
        document.getElementById("loginBtn").onclick = async ()=>{
            let uid = document.getElementById("loginUser").value;
            let pwd = document.getElementById("loginPass").value;
            let user = await verifyLogin(uid, pwd);
            if(user){
                currentUser = user;
                // force change if default hash (admin/admin or changeme)
                let defaultAdminHash = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918";
                if(user.user_id==="admin" && user.password_hash===defaultAdminHash){
                    let newPwd = prompt("First login: please change your password");
                    if(newPwd && newPwd.length>3){
                        user.password_hash = await hashPassword(newPwd);
                        saveUserToLocal(user);
                        alert("Password updated");
                    } else { alert("Password change required"); return; }
                }
                renderSidebar();
                activePage = "dashboard";
                renderCurrentPage();
            } else document.getElementById("loginError").innerText = "Invalid credentials";
        };
    }

    async function init(){
        seedLocalStorageIfEmpty();
        loadDataFromLocal();
        let savedUser = localStorage.getItem("gx_current_user");
        if(savedUser){
            try{
                let u = JSON.parse(savedUser);
                let fresh = localData.users.find(us=>us.user_id===u.user_id);
                if(fresh && fresh.active) currentUser = fresh;
                else currentUser = null;
            }catch(e){}
        }
        if(currentUser){
            renderSidebar();
            renderCurrentPage();
        } else showLogin();
        // menu toggle
        document.getElementById("menuToggle")?.addEventListener("click",()=>{ document.getElementById("sidebar").classList.toggle("open"); });
        document.getElementById("logoutBtn")?.addEventListener("click",()=>{ localStorage.removeItem("gx_current_user"); currentUser=null; showLogin(); });
        window.addEventListener("beforeunload",()=>{ if(currentUser) localStorage.setItem("gx_current_user", JSON.stringify({user_id:currentUser.user_id})); });
        document.getElementById("userInfoSidebar")?.addEventListener("click",()=>{});
    }
    init();
</script>
