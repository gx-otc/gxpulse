<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GXPULSE | GX OTC Market Intelligence</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Your existing CSS (keep as before) */
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
        body { background:#0a0c10; color:#eef2ff; height:100vh; overflow:hidden; }
        .app { display:flex; height:100vh; width:100%; position:relative; }
        .sidebar { width:280px; background:#111317; border-right:1px solid #2a2e3a; display:flex; flex-direction:column; transition:transform 0.2s; z-index:100; }
        .sidebar-header { padding:1.5rem 1.2rem; border-bottom:1px solid #2a2e3a; }
        .logo { display:flex; align-items:center; gap:12px; }
        .logo-icon { background:#2b5f3b; width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:1.4rem; }
        .logo-text h1 { font-size:1.4rem; }
        .logo-text p { font-size:0.7rem; opacity:0.7; }
        .nav-menu { flex:1; padding:1rem 0; }
        .nav-item { display:flex; align-items:center; gap:14px; padding:0.8rem 1.5rem; margin:0.2rem 0.8rem; border-radius:12px; cursor:pointer; color:#b0b7c9; }
        .nav-item i { width:24px; }
        .nav-item.active { background:#2b5f3b; color:white; }
        .nav-item:hover:not(.active) { background:#1e2128; color:#eef2ff; }
        .main { flex:1; overflow-y:auto; background:#0f1117; padding:1.5rem; }
        .mobile-header { display:none; justify-content:space-between; background:#111317; padding:1rem; border-bottom:1px solid #2a2e3a; position:sticky; top:0; z-index:90; }
        .menu-toggle { background:none; border:none; font-size:1.6rem; color:white; cursor:pointer; }
        .card { background:#14171f; border-radius:20px; padding:1.2rem; margin-bottom:1.5rem; border:1px solid #252a36; }
        .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; margin-bottom:1.5rem; }
        .kpi-card { background:#1a1e28; border-radius:20px; padding:1rem; text-align:center; }
        .kpi-number { font-size:2rem; font-weight:700; color:#4caf7f; }
        .charts-row { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-bottom:1.5rem; }
        .chart-container { background:#14171f; border-radius:20px; padding:1rem; }
        canvas { max-height:280px; width:100%; }
        .data-table { width:100%; border-collapse:collapse; overflow-x:auto; display:block; }
        .data-table th, .data-table td { text-align:left; padding:0.8rem 0.5rem; border-bottom:1px solid #2a2e3a; }
        input, select, button { background:#1e212a; border:1px solid #323842; padding:8px 14px; border-radius:12px; color:white; }
        button { background:#2b5f3b; border:none; cursor:pointer; font-weight:600; }
        button.danger { background:#a12a2a; }
        button.small { padding:4px 8px; font-size:0.8rem; margin:0 2px; }
        .filter-bar { display:flex; flex-wrap:wrap; gap:1rem; margin-bottom:1.5rem; align-items:center; }
        @media (max-width:768px) {
            .sidebar { position:fixed; left:-280px; height:100%; transition:left 0.2s; z-index:200; }
            .sidebar.open { left:0; }
            .mobile-header { display:flex; }
            .main { padding:1rem; }
            .charts-row { grid-template-columns:1fr; }
        }
        .alert { background:#1e2128; padding:0.8rem; border-radius:12px; margin:0.5rem 0; }
        .loading { text-align:center; padding:2rem; font-style:italic; }
        .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; z-index:1000; }
        .modal-content { background:#14171f; padding:2rem; border-radius:20px; min-width:300px; max-width:500px; }
    </style>
</head>
<body>
<div class="mobile-header">
    <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
    <div class="logo-text"><strong>GXPULSE</strong></div>
    <div id="mobileUserBadge"></div>
</div>
<div class="app">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon">GX</div>
                <div class="logo-text">
                    <h1>GXPULSE</h1>
                    <p>GX OTC Market Intelligence</p>
                </div>
            </div>
        </div>
        <div class="nav-menu" id="navMenu"></div>
        <div style="padding:1rem; border-top:1px solid #2a2e3a;">
            <div id="userInfoSidebar"></div>
            <button id="logoutBtn" class="danger" style="width:100%; margin-top:10px;">Logout</button>
        </div>
    </div>
    <div class="main" id="mainContent">
        <div id="pageContent">Loading GXPULSE...</div>
    </div>
</div>

<script>
    // ------------------------------- CONFIG ----------------------------------
    const SUPABASE_URL = "https://vglnekxeyypojwulsaqt.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_4Q6O8-pl_ILuWrVW-MMqMw_ErlN7QDj";
    let supabaseClient;
    let currentUser = null;
    let activePage = "dashboard";
    let chartInstances = {};

    // Global data
    let markets = [];
    let commodities = [];
    let entries = [];
    let users = [];

    // Helper: init supabase client
    function initSupabase() {
        if (!supabaseClient) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
    }

    // Fetch all data from Supabase
    async function loadDataFromCloud() {
        initSupabase();
        try {
            const [marketsRes, commoditiesRes, entriesRes, usersRes] = await Promise.all([
                supabaseClient.from('gx_markets').select('*'),
                supabaseClient.from('gx_commodities').select('*'),
                supabaseClient.from('gx_entries').select('*').order('date', { ascending: false }).limit(10000),
                supabaseClient.from('gx_users').select('*')
            ]);
            if (marketsRes.error) throw marketsRes.error;
            if (commoditiesRes.error) throw commoditiesRes.error;
            if (entriesRes.error) throw entriesRes.error;
            if (usersRes.error) throw usersRes.error;
            markets = marketsRes.data || [];
            commodities = commoditiesRes.data || [];
            entries = entriesRes.data || [];
            users = usersRes.data || [];
            localStorage.setItem('gx_markets', JSON.stringify(markets));
            localStorage.setItem('gx_commodities', JSON.stringify(commodities));
            localStorage.setItem('gx_entries', JSON.stringify(entries));
            localStorage.setItem('gx_users', JSON.stringify(users));
            console.log(`Loaded ${entries.length} entries from Supabase`);
        } catch (err) {
            console.warn('Cloud fetch failed, using local cache', err);
            if (localStorage.getItem('gx_markets')) markets = JSON.parse(localStorage.getItem('gx_markets'));
            if (localStorage.getItem('gx_commodities')) commodities = JSON.parse(localStorage.getItem('gx_commodities'));
            if (localStorage.getItem('gx_entries')) entries = JSON.parse(localStorage.getItem('gx_entries'));
            if (localStorage.getItem('gx_users')) users = JSON.parse(localStorage.getItem('gx_users'));
        }
    }

    // ------------------------------- CRUD Helpers ----------------------------------
    async function addMarket(market) {
        const { error } = await supabaseClient.from('gx_markets').insert(market);
        if (error) throw error;
        await loadDataFromCloud(); // refresh all data after change
    }
    async function updateMarket(marketId, updates) {
        const { error } = await supabaseClient.from('gx_markets').update(updates).eq('market_id', marketId);
        if (error) throw error;
        await loadDataFromCloud();
    }
    async function deleteMarket(marketId) {
        const { error } = await supabaseClient.from('gx_markets').delete().eq('market_id', marketId);
        if (error) throw error;
        await loadDataFromCloud();
    }

    async function addCommodity(commodity) {
        const { error } = await supabaseClient.from('gx_commodities').insert(commodity);
        if (error) throw error;
        await loadDataFromCloud();
    }
    async function updateCommodity(commId, updates) {
        const { error } = await supabaseClient.from('gx_commodities').update(updates).eq('commodity_id', commId);
        if (error) throw error;
        await loadDataFromCloud();
    }
    async function deleteCommodity(commId) {
        const { error } = await supabaseClient.from('gx_commodities').delete().eq('commodity_id', commId);
        if (error) throw error;
        await loadDataFromCloud();
    }

    async function addEntry(entry) {
        const { error } = await supabaseClient.from('gx_entries').insert(entry);
        if (error) throw error;
        await loadDataFromCloud(); // refresh all data
    }
    async function updateEntry(entryId, updates) {
        const { error } = await supabaseClient.from('gx_entries').update(updates).eq('entry_id', entryId);
        if (error) throw error;
        await loadDataFromCloud();
    }
    async function deleteEntry(entryId) {
        const { error } = await supabaseClient.from('gx_entries').delete().eq('entry_id', entryId);
        if (error) throw error;
        await loadDataFromCloud();
    }

    // Password helpers
    async function hashPassword(pwd) {
        const encoder = new TextEncoder();
        const data = encoder.encode(pwd);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2,'0')).join('');
    }
    async function verifyLogin(userId, password) {
        let user = users.find(u => u.user_id.toLowerCase() === userId.toLowerCase());
        if (!user) return null;
        let hashed = await hashPassword(password);
        if (user.password_hash === hashed && user.active) return user;
        return null;
    }
    async function updateUserPassword(userId, newPassword) {
        const newHash = await hashPassword(newPassword);
        const { error } = await supabaseClient.from('gx_users').update({ password_hash: newHash }).eq('user_id', userId);
        if (error) throw error;
        await loadDataFromCloud();
    }
    async function createUser(newUser) {
        const { error } = await supabaseClient.from('gx_users').insert(newUser);
        if (error) throw error;
        await loadDataFromCloud();
    }
    async function updateUser(userId, updates) {
        const { error } = await supabaseClient.from('gx_users').update(updates).eq('user_id', userId);
        if (error) throw error;
        await loadDataFromCloud();
    }
    async function deleteUser(userId) {
        const { error } = await supabaseClient.from('gx_users').delete().eq('user_id', userId);
        if (error) throw error;
        await loadDataFromCloud();
    }

    // ------------------------------- UI Rendering ----------------------------------
    function renderSidebar() {
        if (!currentUser) return;
        const nav = document.getElementById("navMenu");
        const items = [
            { id: "dashboard", icon: "fas fa-tachometer-alt", label: "Dashboard", roles: ["admin","staff","merchant","analyst"] },
            { id: "reports", icon: "fas fa-chart-line", label: "Reports", roles: ["admin","staff","analyst"] },
            { id: "trend", icon: "fas fa-chart-simple", label: "Trend Charts", roles: ["admin","staff","analyst"] },
            { id: "compare", icon: "fas fa-exchange-alt", label: "Market Compare", roles: ["admin","staff","analyst"] },
            { id: "arbitrage", icon: "fas fa-balance-scale", label: "Arbitrage", roles: ["admin","staff","analyst"] }
        ];
        if (currentUser.role === "admin") items.push({ id: "admin", icon: "fas fa-user-cog", label: "Admin", roles: ["admin"] });
        nav.innerHTML = items.filter(item => item.roles.includes(currentUser.role)).map(item => `
            <div class="nav-item ${activePage === item.id ? 'active' : ''}" data-page="${item.id}">
                <i class="${item.icon}"></i><span>${item.label}</span>
            </div>
        `).join("");
        document.querySelectorAll(".nav-item").forEach(el => {
            el.addEventListener("click", () => {
                activePage = el.dataset.page;
                renderCurrentPage();
            });
        });
        document.getElementById("userInfoSidebar").innerHTML = `<i class="fas fa-user"></i> ${currentUser.full_name} (${currentUser.role})`;
    }

    async function renderCurrentPage() {
        if (!currentUser) { showLogin(); return; }
        const container = document.getElementById("pageContent");
        container.innerHTML = '<div class="loading">Loading data...</div>';
        await loadDataFromCloud(); // always fetch latest data
        if (activePage === "dashboard") await renderDashboard(container);
        else if (activePage === "reports") await renderReports(container);
        else if (activePage === "trend") await renderTrendCharts(container);
        else if (activePage === "compare") await renderMarketCompare(container);
        else if (activePage === "arbitrage") await renderArbitrage(container);
        else if (activePage === "admin" && currentUser.role === "admin") await renderAdmin(container);
        else container.innerHTML = `<div class="card">Page not available for your role.</div>`;
        if (window.innerWidth < 768) document.getElementById("sidebar").classList.remove("open");
    }

    // Dashboard (unchanged except quick entry now uses the same addEntry)
    async function renderDashboard(container) {
        const totalMarkets = markets.length;
        const totalCommodities = commodities.length;
        const totalEntries = entries.length;
        const avgPrice = entries.length ? (entries.reduce((sum, e) => sum + (e.price || 0), 0) / entries.length).toFixed(0) : 0;

        container.innerHTML = `
            <div class="kpi-grid">
                <div class="kpi-card"><div class="kpi-number">${totalMarkets}</div><div>Markets</div></div>
                <div class="kpi-card"><div class="kpi-number">${totalCommodities}</div><div>Commodities</div></div>
                <div class="kpi-card"><div class="kpi-number">${totalEntries}</div><div>Price Records</div></div>
                <div class="kpi-card"><div class="kpi-number">₦${avgPrice}</div><div>Avg Price</div></div>
            </div>
            <div class="charts-row">
                <div class="chart-container"><canvas id="pieChart"></canvas></div>
                <div class="chart-container"><canvas id="timeChart"></canvas></div>
            </div>
            <div class="card"><h3>Latest Prices</h3><div style="overflow-x:auto;"><table class="data-table"><thead> <tr><th>Date</th><th>Market</th><th>Commodity</th><th>Price (₦)</th></tr></thead><tbody id="latestTableBody"></tbody></table></div></div>
        `;

        // Pie chart
        const marketCounts = {};
        entries.forEach(e => { marketCounts[e.market_name] = (marketCounts[e.market_name] || 0) + 1; });
        const pieLabels = Object.keys(marketCounts).slice(0,10);
        const pieData = pieLabels.map(l => marketCounts[l]);
        if (chartInstances.pie) chartInstances.pie.destroy();
        const pieCtx = document.getElementById("pieChart").getContext("2d");
        chartInstances.pie = new Chart(pieCtx, { type:'pie', data:{ labels:pieLabels, datasets:[{ data:pieData, backgroundColor:['#2b5f3b','#3b8c5c','#4caf7f','#1e4a2e','#6fbf8f','#2e7d5e','#5cb85c','#3d9970','#218c74','#0b5e2e'] }] } });

        // Time series
        const dateMap = new Map();
        entries.forEach(e => { dateMap.set(e.date, (dateMap.get(e.date) || 0) + 1); });
        const sortedDates = Array.from(dateMap.keys()).sort().slice(-30);
        const counts = sortedDates.map(d => dateMap.get(d));
        if (chartInstances.time) chartInstances.time.destroy();
        const timeCtx = document.getElementById("timeChart").getContext("2d");
        chartInstances.time = new Chart(timeCtx, { type:'line', data:{ labels:sortedDates, datasets:[{ label:'Entries per day', data:counts, borderColor:'#4caf7f', backgroundColor:'rgba(76,175,127,0.1)', fill:true }] } });

        const latest = [...entries].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,10);
        document.getElementById("latestTableBody").innerHTML = latest.map(e => `<tr><td>${e.date}</td><td>${e.market_name}</td><td>${e.commodity_name}</td><td>₦${Number(e.price).toLocaleString()}</td></tr>`).join("");

        // Quick price entry with date picker
        if (currentUser.role === 'admin' || currentUser.role === 'staff') {
            const quickForm = `
                <div class="card">
                    <h3>Quick Price Entry</h3>
                    <div class="filter-bar">
                        <input type="date" id="quickDate" value="${new Date().toISOString().split('T')[0]}">
                        <select id="quickMarket"><option value="">Market</option>${markets.map(m => `<option value="${m.market_id}">${m.market_name}</option>`).join("")}</select>
                        <select id="quickCommodity"><option value="">Commodity</option>${commodities.map(c => `<option value="${c.commodity_id}">${c.commodity_name}</option>`).join("")}</select>
                        <input type="number" id="quickPrice" placeholder="Price (₦)">
                        <button id="quickSubmit">Submit</button>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML("beforeend", quickForm);
            document.getElementById("quickSubmit").onclick = async () => {
                const date = document.getElementById("quickDate").value;
                const marketId = document.getElementById("quickMarket").value;
                const commodityId = document.getElementById("quickCommodity").value;
                const price = parseFloat(document.getElementById("quickPrice").value);
                if (!date || !marketId || !commodityId || isNaN(price)) { alert("Fill all fields"); return; }
                const marketObj = markets.find(m => m.market_id === marketId);
                const commodityObj = commodities.find(c => c.commodity_id === commodityId);
                const newEntry = {
                    entry_id: "e_" + Date.now(),
                    date: date,
                    timestamp_ms: new Date(date).getTime(),
                    market_id: marketId,
                    market_name: marketObj ? marketObj.market_name : "",
                    commodity_id: commodityId,
                    commodity_name: commodityObj ? commodityObj.commodity_name : "",
                    price: price,
                    user_id: currentUser.user_id,
                    source: "web",
                    created_at: new Date().toISOString()
                };
                try {
                    await addEntry(newEntry);
                    renderCurrentPage(); // reload page to show updated count
                } catch (err) {
                    alert("Error saving entry: " + err.message);
                }
            };
        }
    }

    // Reports with edit/delete (same as before, but refresh after changes)
    async function renderReports(container) {
        let filteredEntries = entries;
        if (currentUser.role === 'staff') {
            filteredEntries = entries.filter(e => e.user_id === currentUser.user_id);
        }
        container.innerHTML = `
            <div class="card">
                <h3>Filter Reports</h3>
                <div class="filter-bar" id="reportFilters"></div>
                <div style="overflow-x:auto;">
                    <table class="data-table" id="reportTable"></table>
                </div>
            </div>
        `;
        const filterDiv = document.getElementById("reportFilters");
        filterDiv.innerHTML = `
            <select id="repMarket"><option value="">All Markets</option>${markets.map(m => `<option value="${m.market_id}">${m.market_name}</option>`).join("")}</select>
            <select id="repCommodity"><option value="">All Commodities</option>${commodities.map(c => `<option value="${c.commodity_id}">${c.commodity_name}</option>`).join("")}</select>
            <input type="date" id="repStart" placeholder="Start Date"><input type="date" id="repEnd" placeholder="End Date"><button id="applyReport">Apply</button>
        `;
        const refresh = () => {
            const marketId = document.getElementById("repMarket").value;
            const commodityId = document.getElementById("repCommodity").value;
            const start = document.getElementById("repStart").value;
            const end = document.getElementById("repEnd").value;
            let filtered = filteredEntries;
            if (marketId) filtered = filtered.filter(e => e.market_id === marketId);
            if (commodityId) filtered = filtered.filter(e => e.commodity_id === commodityId);
            if (start) filtered = filtered.filter(e => e.date >= start);
            if (end) filtered = filtered.filter(e => e.date <= end);
            const rows = filtered.slice(0,200).map(e => `
                <tr>
                    <td>${e.date}</td>
                    <td>${e.market_name}</td>
                    <td>${e.commodity_name}</td>
                    <td>₦${Number(e.price).toLocaleString()}</td>
                    <td>${e.user_id}</td>
                    <td>
                        ${(currentUser.role === 'admin' || (currentUser.role === 'staff' && e.user_id === currentUser.user_id)) ? `
                            <button class="small editEntry" data-id="${e.entry_id}" data-date="${e.date}" data-market="${e.market_id}" data-commodity="${e.commodity_id}" data-price="${e.price}"><i class="fas fa-edit"></i> Edit</button>
                            <button class="small danger deleteEntry" data-id="${e.entry_id}"><i class="fas fa-trash"></i> Delete</button>
                        ` : ''}
                    </td>
                </tr>
            `).join("");
            document.getElementById("reportTable").innerHTML = `<thead><tr><th>Date</th><th>Market</th><th>Commodity</th><th>Price</th><th>User</th><th>Actions</th></tr></thead><tbody>${rows}</tbody>`;
            // Attach edit/delete handlers
            document.querySelectorAll(".editEntry").forEach(btn => {
                btn.onclick = () => showEditModal(btn.dataset.id, btn.dataset.date, btn.dataset.market, btn.dataset.commodity, btn.dataset.price);
            });
            document.querySelectorAll(".deleteEntry").forEach(btn => {
                btn.onclick = async () => {
                    if (confirm("Delete this entry?")) {
                        await deleteEntry(btn.dataset.id);
                        refresh(); // re-apply filters after delete
                    }
                };
            });
        };
        document.getElementById("applyReport").onclick = refresh;
        refresh();
    }

    function showEditModal(entryId, date, marketId, commodityId, price) {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h3>Edit Entry</h3>
                <input type="date" id="editDate" value="${date}"><br><br>
                <select id="editMarket">${markets.map(m => `<option value="${m.market_id}" ${m.market_id === marketId ? 'selected' : ''}>${m.market_name}</option>`).join("")}</select><br><br>
                <select id="editCommodity">${commodities.map(c => `<option value="${c.commodity_id}" ${c.commodity_id === commodityId ? 'selected' : ''}>${c.commodity_name}</option>`).join("")}</select><br><br>
                <input type="number" id="editPrice" value="${price}" placeholder="Price"><br><br>
                <button id="saveEdit">Save</button>
                <button id="cancelEdit">Cancel</button>
            </div>
        `;
        document.body.appendChild(modal);
        document.getElementById("saveEdit").onclick = async () => {
            const newDate = document.getElementById("editDate").value;
            const newMarketId = document.getElementById("editMarket").value;
            const newCommodityId = document.getElementById("editCommodity").value;
            const newPrice = parseFloat(document.getElementById("editPrice").value);
            const newMarket = markets.find(m => m.market_id === newMarketId);
            const newCommodity = commodities.find(c => c.commodity_id === newCommodityId);
            await updateEntry(entryId, {
                date: newDate,
                timestamp_ms: new Date(newDate).getTime(),
                market_id: newMarketId,
                market_name: newMarket ? newMarket.market_name : "",
                commodity_id: newCommodityId,
                commodity_name: newCommodity ? newCommodity.commodity_name : "",
                price: newPrice
            });
            modal.remove();
            renderCurrentPage(); // refresh the whole page to reflect changes
        };
        document.getElementById("cancelEdit").onclick = () => modal.remove();
    }

    // Trend, Compare, Arbitrage (unchanged)
    async function renderTrendCharts(container) {
        container.innerHTML = `<div class="card"><h3>Latest Price Across Markets</h3><div class="filter-bar"><select id="trendCommodity"></select></div><canvas id="trendBarChart"></canvas></div>`;
        const select = document.getElementById("trendCommodity");
        select.innerHTML = commodities.map(c => `<option value="${c.commodity_id}">${c.commodity_name}</option>`).join("");
        const renderBar = (commId) => {
            const latestByMarket = new Map();
            entries.filter(e => e.commodity_id === commId).forEach(e => {
                if (!latestByMarket.has(e.market_id) || new Date(e.date) > new Date(latestByMarket.get(e.market_id).date)) {
                    latestByMarket.set(e.market_id, e);
                }
            });
            const labels = Array.from(latestByMarket.values()).map(e => e.market_name);
            const data = Array.from(latestByMarket.values()).map(e => e.price);
            if (chartInstances.trendBar) chartInstances.trendBar.destroy();
            const ctx = document.getElementById("trendBarChart").getContext("2d");
            chartInstances.trendBar = new Chart(ctx, { type:'bar', data:{ labels, datasets:[{ label:'Latest Price (₦)', data, backgroundColor:['#2b5f3b','#3b8c5c','#4caf7f','#1e4a2e','#6fbf8f','#2e7d5e','#5cb85c','#3d9970','#218c74','#0b5e2e'] }] } });
        };
        select.onchange = (e) => renderBar(e.target.value);
        if (commodities.length) renderBar(commodities[0].commodity_id);
    }

    async function renderMarketCompare(container) {
        container.innerHTML = `<div class="card"><h3>Market Compare</h3><div class="filter-bar"><select id="compareCommodity"></select><button id="compareBtn">Compare</button></div><canvas id="compareChart"></canvas><div id="compareTable"></div></div>`;
        const select = document.getElementById("compareCommodity");
        select.innerHTML = commodities.map(c => `<option value="${c.commodity_id}">${c.commodity_name}</option>`).join("");
        const compare = () => {
            const commId = select.value;
            const latestByMarket = new Map();
            entries.filter(e => e.commodity_id === commId).forEach(e => {
                if (!latestByMarket.has(e.market_id) || new Date(e.date) > new Date(latestByMarket.get(e.market_id).date)) {
                    latestByMarket.set(e.market_id, e);
                }
            });
            const items = Array.from(latestByMarket.values());
            const labels = items.map(e => e.market_name);
            const data = items.map(e => e.price);
            if (chartInstances.compare) chartInstances.compare.destroy();
            const ctx = document.getElementById("compareChart").getContext("2d");
            chartInstances.compare = new Chart(ctx, { type:'bar', data:{ labels, datasets:[{ label:'Latest Price (₦)', data, backgroundColor:'#3b8c5c' }] } });
            document.getElementById("compareTable").innerHTML = `<table class="data-table"><thead><tr><th>Market</th><th>Price (₦)</th><th>Date</th></tr></thead><tbody>${items.map(e => `<tr><td>${e.market_name}</td><td>₦${Number(e.price).toLocaleString()}</td><td>${e.date}</td></tr>`).join("")}</tbody></table>`;
        };
        document.getElementById("compareBtn").onclick = compare;
        if (commodities.length) compare();
    }

    async function renderArbitrage(container) {
        container.innerHTML = `<div class="card"><h3>Arbitrage Opportunities</h3><div class="filter-bar"><select id="arbitrageCommodity"></select><button id="arbitrageBtn">Analyze</button></div><div id="arbitrageResult"></div></div>`;
        const select = document.getElementById("arbitrageCommodity");
        select.innerHTML = commodities.map(c => `<option value="${c.commodity_id}">${c.commodity_name}</option>`).join("");
        const analyze = () => {
            const commId = select.value;
            const latestByMarket = new Map();
            entries.filter(e => e.commodity_id === commId).forEach(e => {
                if (!latestByMarket.has(e.market_id) || new Date(e.date) > new Date(latestByMarket.get(e.market_id).date)) {
                    latestByMarket.set(e.market_id, e);
                }
            });
            const items = Array.from(latestByMarket.values());
            if (items.length < 2) {
                document.getElementById("arbitrageResult").innerHTML = `<div class="alert">Insufficient data for this commodity (need at least two markets).</div>`;
                return;
            }
            items.sort((a,b) => a.price - b.price);
            const min = items[0];
            const max = items[items.length-1];
            const spread = max.price - min.price;
            const potential = ((max.price - min.price) / min.price * 100).toFixed(1);
            document.getElementById("arbitrageResult").innerHTML = `
                <div class="alert" style="background:#1e2a24;">
                    <strong>Buy at:</strong> ${min.market_name} @ ₦${Number(min.price).toLocaleString()}<br>
                    <strong>Sell at:</strong> ${max.market_name} @ ₦${Number(max.price).toLocaleString()}<br>
                    <strong>Spread:</strong> ₦${spread.toLocaleString()} (${potential}% potential gain)<br>
                </div>
                <table class="data-table"><thead><tr><th>Market</th><th>Price (₦)</th><th>Date</th></tr></thead><tbody>${items.map(e => `<tr><td>${e.market_name}</td><td>₦${Number(e.price).toLocaleString()}</td><td>${e.date}</td></tr>`).join("")}</tbody></table>
            `;
        };
        document.getElementById("arbitrageBtn").onclick = analyze;
        if (commodities.length) analyze();
    }

    // Admin panel with full CRUD, now with refresh after every action
    async function renderAdmin(container) {
        container.innerHTML = `
            <div class="card">
                <h3>Admin Panel</h3>
                <div><button id="syncCloudBtn">Sync to Cloud (Manual)</button><button id="resetLocalBtn" class="danger">Reset Local Cache</button></div>
                <div id="syncStatus"></div>
            </div>
            <div class="card"><h3>Markets</h3><div id="marketsAdmin"></div><button id="addMarketBtn">+ Add Market</button></div>
            <div class="card"><h3>Commodities</h3><div id="commoditiesAdmin"></div><button id="addCommodityBtn">+ Add Commodity</button></div>
            <div class="card"><h3>Users</h3><div id="usersAdmin"></div><button id="addUserBtn">+ Add User</button></div>
            <div class="card"><h3>Entries (Historical)</h3><div><button id="importEntriesBtn">Re‑import All Entries from CSV</button></div><div id="importStatus"></div></div>
        `;

        // Render tables with inline edit/delete, and auto‑refresh after each action
        const renderMarkets = () => {
            document.getElementById("marketsAdmin").innerHTML = `<table class="data-table"><thead><tr><th>ID</th><th>Name</th><th>Actions</th></tr></thead><tbody>${markets.map(m => `
                <tr>
                    <td>${m.market_id}</td>
                    <td><input type="text" id="mname_${m.market_id}" value="${m.market_name}"></td>
                    <td><button class="small updateMarket" data-id="${m.market_id}">Update</button> <button class="small danger deleteMarket" data-id="${m.market_id}">Delete</button></td>
                </tr>
            `).join("")}</tbody></table>`;
            document.querySelectorAll(".updateMarket").forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.dataset.id;
                    const newName = document.getElementById(`mname_${id}`).value;
                    if (!newName) return;
                    await updateMarket(id, { market_name: newName });
                    renderMarkets();
                };
            });
            document.querySelectorAll(".deleteMarket").forEach(btn => {
                btn.onclick = async () => {
                    if (confirm("Delete market? This may affect entries.")) {
                        await deleteMarket(btn.dataset.id);
                        renderMarkets();
                    }
                };
            });
        };
        const renderCommodities = () => {
            document.getElementById("commoditiesAdmin").innerHTML = `<table class="data-table"><thead><tr><th>ID</th><th>Name</th><th>Canonical Key</th><th>Actions</th></tr></thead><tbody>${commodities.map(c => `
                <tr>
                    <td>${c.commodity_id}</td>
                    <td><input type="text" id="cname_${c.commodity_id}" value="${c.commodity_name}"></td>
                    <td><input type="text" id="ckey_${c.commodity_id}" value="${c.canonical_key || ''}"></td>
                    <td><button class="small updateCommodity" data-id="${c.commodity_id}">Update</button> <button class="small danger deleteCommodity" data-id="${c.commodity_id}">Delete</button></td>
                </tr>
            `).join("")}</tbody></table>`;
            document.querySelectorAll(".updateCommodity").forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.dataset.id;
                    const newName = document.getElementById(`cname_${id}`).value;
                    const newKey = document.getElementById(`ckey_${id}`).value;
                    if (!newName) return;
                    await updateCommodity(id, { commodity_name: newName, canonical_key: newKey });
                    renderCommodities();
                };
            });
            document.querySelectorAll(".deleteCommodity").forEach(btn => {
                btn.onclick = async () => {
                    if (confirm("Delete commodity? This may affect entries.")) {
                        await deleteCommodity(btn.dataset.id);
                        renderCommodities();
                    }
                };
            });
        };
        const renderUsers = () => {
            document.getElementById("usersAdmin").innerHTML = `<table class="data-table"><thead><tr><th>User ID</th><th>Full Name</th><th>Role</th><th>Active</th><th>Actions</th></tr></thead><tbody>${users.map(u => `
                <tr>
                    <td>${u.user_id}</td>
                    <td><input type="text" id="uname_${u.user_id}" value="${u.full_name}"></td>
                    <td><select id="urole_${u.user_id}"><option ${u.role==='admin'?'selected':''}>admin</option><option ${u.role==='staff'?'selected':''}>staff</option><option ${u.role==='merchant'?'selected':''}>merchant</option><option ${u.role==='analyst'?'selected':''}>analyst</option></select></td>
                    <td><input type="checkbox" id="uactive_${u.user_id}" ${u.active ? 'checked' : ''}></td>
                    <td><button class="small updateUser" data-id="${u.user_id}">Update</button> <button class="small danger deleteUser" data-id="${u.user_id}">Delete</button></td>
                </tr>
            `).join("")}</tbody></table>`;
            document.querySelectorAll(".updateUser").forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.dataset.id;
                    const newName = document.getElementById(`uname_${id}`).value;
                    const newRole = document.getElementById(`urole_${id}`).value;
                    const newActive = document.getElementById(`uactive_${id}`).checked;
                    await updateUser(id, { full_name: newName, role: newRole, active: newActive });
                    renderUsers();
                };
            });
            document.querySelectorAll(".deleteUser").forEach(btn => {
                btn.onclick = async () => {
                    if (confirm("Delete user? This will remove all entries linked to them.")) {
                        await deleteUser(btn.dataset.id);
                        renderUsers();
                    }
                };
            });
        };

        document.getElementById("addMarketBtn").onclick = async () => {
            const id = prompt("Enter market ID (unique, e.g., 'm15'):");
            const name = prompt("Enter market name:");
            if (id && name) {
                await addMarket({ market_id: id, market_name: name, country: "Nigeria", active: true });
                renderMarkets();
            }
        };
        document.getElementById("addCommodityBtn").onclick = async () => {
            const id = prompt("Enter commodity ID (unique, e.g., 'c_new'):");
            const name = prompt("Enter commodity name:");
            if (id && name) {
                await addCommodity({ commodity_id: id, commodity_name: name, canonical_key: name.toLowerCase().replace(/ /g,'_'), active: true });
                renderCommodities();
            }
        };
        document.getElementById("addUserBtn").onclick = async () => {
            const uid = prompt("Enter user ID (e.g., 'newuser'):");
            const name = prompt("Enter full name:");
            const role = prompt("Role (admin/staff/merchant/analyst):", "staff");
            if (uid && name && role) {
                const defaultPwd = "changeme";
                const hash = await hashPassword(defaultPwd);
                await createUser({ user_id: uid, full_name: name, role, active: true, password_hash: hash, created_at: new Date().toISOString() });
                renderUsers();
                alert(`User ${uid} created with default password "changeme".`);
            }
        };

        // Helper to import entries from a CSV file
        document.getElementById("importEntriesBtn").onclick = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.csv';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const text = await file.text();
                const rows = text.split('\n').slice(1); // skip header
                let count = 0;
                for (const row of rows) {
                    if (!row.trim()) continue;
                    const cols = row.split(',');
                    // assume order: entry_id,date,timestamp_ms,market_id,market_name,commodity_id,commodity_name,price,user_id,...
                    const entry = {
                        entry_id: cols[0],
                        date: cols[1],
                        timestamp_ms: parseInt(cols[2]),
                        market_id: cols[3],
                        market_name: cols[4],
                        commodity_id: cols[5],
                        commodity_name: cols[6],
                        price: parseFloat(cols[7]),
                        user_id: cols[8] || 'historical_seed',
                        source: 'csv_import',
                        created_at: new Date().toISOString()
                    };
                    try {
                        await addEntry(entry);
                        count++;
                    } catch (err) {
                        console.warn('Failed to insert row', entry, err);
                    }
                }
                document.getElementById("importStatus").innerHTML = `<div class="alert">Imported ${count} entries. Reloading...</div>`;
                setTimeout(() => location.reload(), 2000);
            };
            input.click();
        };

        renderMarkets();
        renderCommodities();
        renderUsers();

        document.getElementById("syncCloudBtn").onclick = () => { document.getElementById("syncStatus").innerHTML = "<div class='alert'>Sync is automatic. All changes saved to cloud.</div>"; };
        document.getElementById("resetLocalBtn").onclick = () => { localStorage.clear(); alert("Cache cleared. Reloading..."); location.reload(); };
    }

    // Login screen (unchanged)
    function showLogin() {
        document.getElementById("pageContent").innerHTML = `
            <div class="card" style="max-width:400px; margin:2rem auto;">
                <h2>GXPULSE Login</h2>
                <input type="text" id="loginUser" placeholder="User ID" autocomplete="off"><br><br>
                <input type="password" id="loginPass" placeholder="Password"><br><br>
                <button id="loginBtn">Login</button>
                <div id="loginError" style="color:#ff8a6a; margin-top:1rem;"></div>
            </div>
        `;
        document.getElementById("loginBtn").onclick = async () => {
            const uid = document.getElementById("loginUser").value;
            const pwd = document.getElementById("loginPass").value;
            await loadDataFromCloud();
            const user = await verifyLogin(uid, pwd);
            if (user) {
                currentUser = user;
                const defaultAdminHash = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918";
                const defaultStaffHash = "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8";
                if ((user.user_id === "admin" && user.password_hash === defaultAdminHash) || (user.user_id !== "admin" && user.password_hash === defaultStaffHash)) {
                    const newPwd = prompt("First login: please change your password");
                    if (newPwd && newPwd.length > 3) {
                        await updateUserPassword(user.user_id, newPwd);
                        currentUser.password_hash = await hashPassword(newPwd);
                        alert("Password updated. Please log in again.");
                        currentUser = null;
                        showLogin();
                        return;
                    } else { alert("Password change required."); return; }
                }
                renderSidebar();
                activePage = "dashboard";
                renderCurrentPage();
            } else {
                document.getElementById("loginError").innerText = "Invalid credentials";
            }
        };
    }

    // Initial load
    (async function init() {
        await loadDataFromCloud();
        const savedUser = localStorage.getItem("gx_current_user");
        if (savedUser) {
            try {
                const u = JSON.parse(savedUser);
                const fresh = users.find(us => us.user_id === u.user_id);
                if (fresh && fresh.active) currentUser = fresh;
                else currentUser = null;
            } catch(e) { currentUser = null; }
        }
        if (currentUser) {
            renderSidebar();
            renderCurrentPage();
        } else {
            showLogin();
        }
        document.getElementById("menuToggle")?.addEventListener("click", () => document.getElementById("sidebar").classList.toggle("open"));
        document.getElementById("logoutBtn")?.addEventListener("click", () => {
            localStorage.removeItem("gx_current_user");
            currentUser = null;
            showLogin();
        });
        window.addEventListener("beforeunload", () => {
            if (currentUser) localStorage.setItem("gx_current_user", JSON.stringify({ user_id: currentUser.user_id }));
        });
    })();
</script>
